<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 | PhotoApp</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe7;
        --surface: rgba(255, 255, 255, 0.76);
        --text: #1c1713;
        --muted: rgba(28, 23, 19, 0.7);
        --accent: #1f6f78;
        --accent-strong: #12454c;
        --border: rgba(20, 18, 16, 0.12);
        --shadow: 0 22px 60px rgba(63, 41, 18, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(31, 111, 120, 0.14), transparent 32%),
          radial-gradient(circle at right 10%, rgba(217, 119, 69, 0.18), transparent 26%),
          linear-gradient(180deg, #fbf8f3 0%, var(--bg) 100%);
        padding: 1rem;
      }

      .card {
        width: min(720px, 100%);
        padding: clamp(1.5rem, 4vw, 3rem);
        border-radius: 28px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        letter-spacing: .16em;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        letter-spacing: -0.04em;
        font-size: clamp(2.4rem, 7vw, 5rem);
        line-height: 0.95;
      }

      p {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: .75rem;
        margin-top: 1.5rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.8rem 1.1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        border: 1px solid var(--border);
      }

      .primary {
        color: #fff;
        background: linear-gradient(145deg, var(--accent), var(--accent-strong));
      }

      .secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.74);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">404</p>
      <h1>ページが見つかりません</h1>
      <p>指定されたURLは存在しないか、移動しました。トップページから写真を見直してください。</p>
      <div class="actions">
        <a class="primary" href="/">トップへ戻る</a>
        <a class="secondary" href="/login">ログイン画面</a>
      </div>
    </main>
  </body>
</html>
